---
- name: Configurer le proxy apt
  copy:
    dest: /etc/apt/apt.conf.d/95proxy
    content: |
      Acquire::http::Proxy "{{ http_proxy_url }}";
      Acquire::https::Proxy "{{ https_proxy_url }}";
    mode: "0644"
  when: http_proxy_url | length > 0

- name: Installer paquets prérequis
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - rsync
    state: present
    update_cache: true

- name: Créer le répertoire des clés apt
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG du dépôt officiel Docker
  get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  environment:
    https_proxy: "{{ https_proxy_url }}"

- name: Ajouter le dépôt officiel Docker
  apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Installer Docker CE {{ docker_target_version }}
  apt:
    name:
      - "docker-ce=5:{{ docker_target_version }}*"
      - "docker-ce-cli=5:{{ docker_target_version }}*"
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Figer la version de Docker (pas de mise à jour involontaire)
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [docker-ce, docker-ce-cli]

- name: Créer le répertoire du drop-in systemd Docker
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  when: http_proxy_url | length > 0

- name: Configurer le proxy du démon Docker
  copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    content: |
      [Service]
      Environment="HTTP_PROXY={{ http_proxy_url }}"
      Environment="HTTPS_PROXY={{ https_proxy_url }}"
      Environment="NO_PROXY={{ no_proxy }}"
    mode: "0644"
  when: http_proxy_url | length > 0
  notify: Redémarrer Docker

- name: Activer Docker
  systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true

- name: Appliquer les handlers maintenant
  meta: flush_handlers
