version: "3.9"

services:

  agent:
    image: portainer/agent:lts

    # Port 9001 : API agent, joint par Portainer via tasks.agent (réseau overlay, rien à publier)

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

    networks:
      - portainer_agent

    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

networks:
  portainer_agent:
    driver: overlay
    attachable: true
