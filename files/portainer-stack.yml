version: "3.9"

services:

  portainer:
    image: portainer/portainer-ce:lts

    command: -H tcp://tasks.agent:9001 --tlsskipverify

    ports:
      - "9000:9000"
      - "9443:9443"

    volumes:
      - portainer_data:/data

    networks:
      - agent_network

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  agent_network:
    external: true
    name: portainer-agent_portainer_agent

volumes:
  portainer_data:
    external: true
