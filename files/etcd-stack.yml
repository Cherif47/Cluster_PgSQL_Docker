version: "3.9"

services:

  etcd1:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd1
    # Ports (overlay, rien à publier) : 2379 client, 2380 peer

    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=CLUSTER

    networks:
      - backend

    volumes:
      - /srv/docker/etcd1:/etcd-data

    deploy:
      placement:
        constraints:
          - node.hostname == SRV-DOCK1

  etcd2:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd2
    # Ports (overlay, rien à publier) : 2379 client, 2380 peer

    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=CLUSTER

    networks:
      - backend

    volumes:
      - /srv/docker/etcd2:/etcd-data

    deploy:
      placement:
        constraints:
          - node.hostname == SRV-DOCK2

  etcd3:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd3
    # Ports (overlay, rien à publier) : 2379 client, 2380 peer

    command:
      - etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=CLUSTER
    networks:
      - backend

    volumes:
      - /srv/docker/etcd3:/etcd-data

    deploy:
      placement:
        constraints:
          - node.hostname == SRV-DOCK3

networks:

  backend:
    external: true
