# Les 3 nœuds sont managers Swarm. Le premier du groupe initialise le swarm.
[manager]
SRV-DOCK1 ansible_host=IP node_id=1
SRV-DOCK2 ansible_host=IP node_id=2
SRV-DOCK3 ansible_host=IP node_id=3

# Nœuds portant HAProxy + Keepalived (VIP)
[lb]
SRV-DOCK1
SRV-DOCK2

[swarm:children]
manager

[postgres:children]
swarm

[swarm:vars]
ansible_user=<user_admin>
